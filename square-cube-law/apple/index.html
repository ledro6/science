<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Закон квадрата–куба · Apple</title>
<style>html,body{margin:0;background:#000}canvas{display:block;height:100vh;width:auto;margin:0 auto}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// ?ep=ep2 — выпуск из episodes/ep2 (timeline + список сцен); без параметра — пилот (build/, scenes/)
const Q = new URLSearchParams(location.search), ep = Q.get('ep');
const base = ep ? `./episodes/${ep}/` : './';
await new Promise((ok, fail) => { const s = document.createElement('script'); s.src = base + 'build/timeline.js'; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
const { boot } = await import('./engine.mjs');
const list = ep ? await (await fetch(base + 'scenes.json')).json() : ['hook', 'cube', 'strength', 'heat', 'fall', 'outro'];
const only = Q.get('only');
for (const id of list.filter(id => !only || only.split(',').includes(id))) {
  try { await import(`${base}scenes/${id}.mjs`); } catch (e) { if (!String(e).includes('Failed to fetch')) console.error('scene ' + id + ': ' + e.message); }
}
await boot();
</script>
</body>
</html>
