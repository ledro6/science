import { boot } from './engine.mjs';
// ?only=hook,cube — загрузить только часть сцен (быстрые проверки)
const only = new URLSearchParams(location.search).get('only');
const ids = ['hook', 'cube', 'strength', 'heat', 'fall', 'outro'].filter(id => !only || only.split(',').includes(id));
for (const id of ids) {

}
